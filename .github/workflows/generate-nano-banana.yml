name: Generate Nano Banana Tarot

on:
  workflow_dispatch:
    inputs:
      card:
        description: "Card slug/number, comma-separated list, or all"
        required: true
        default: "all"
      model:
        description: "Gemini image model"
        required: true
        default: "gemini-2.5-flash-image"
      commit:
        description: "Commit generated assets back to main"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: generate-nano-banana
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pillow

      - name: Generate assets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ inputs.model }}
        run: |
          python scripts/generate_nano_banana_major.py \
            --card "${{ inputs.card }}" \
            --model "${{ inputs.model }}"

      - name: Verify generated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          checks = [("docs/assets/major/full", 466), ("docs/assets/major/half", 233)]
          for folder, expected in checks:
              files = sorted(Path(folder).glob("*.png"))
              if len(files) != 22:
                  raise SystemExit(f"{folder}: expected 22 PNGs, found {len(files)}")
              for path in files:
                  with Image.open(path) as im:
                      if im.size != (expected, expected) or im.mode != "RGBA":
                          raise SystemExit(f"{path}: expected RGBA {expected}x{expected}, got {im.mode} {im.size}")
          print("asset verification passed")
          PY

      - name: Commit generated assets
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/major
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Nano Banana Major Arcana assets"
            git push
          fi
