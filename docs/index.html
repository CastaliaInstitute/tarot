<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Castalia Tarot</title>
    <meta
      name="description"
      content="Round Rider-Waite-Smith Major Arcana assets for Astrolabe."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #101014;
        --panel: #18181f;
        --ink: #f1ebdc;
        --muted: #b7ac98;
        --line: #3a3429;
        --gold: #d8b85f;
        --accent: #8fc7c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.45;
      }

      header {
        padding: 32px clamp(18px, 5vw, 56px) 20px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4.8rem);
        font-weight: 720;
        letter-spacing: 0;
      }

      .lede {
        max-width: 760px;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1rem;
      }

      main {
        padding: 24px clamp(18px, 5vw, 56px) 56px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 24px;
      }

      .toolbar a,
      .toggle button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 6px;
        padding: 9px 12px;
        text-decoration: none;
        font: inherit;
      }

      .toggle {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }

      .toggle button {
        border: 0;
        border-radius: 0;
        cursor: pointer;
      }

      .toggle button[aria-pressed="true"] {
        background: var(--gold);
        color: #14110a;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(154px, 1fr));
        gap: 18px;
      }

      figure {
        margin: 0;
        min-width: 0;
      }

      .disc {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        background: radial-gradient(circle, #22232a 0%, #131318 72%);
        border: 1px solid var(--line);
        border-radius: 50%;
        overflow: hidden;
      }

      .disc img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      figcaption a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Castalia Tarot</h1>
      <p class="lede">
        Round Rider-Waite-Smith Major Arcana assets for the 466px Astrolabe display, with 233px half-diameter variants for triangular layouts.
      </p>
    </header>
    <main>
      <div class="toolbar">
        <div class="toggle" aria-label="Asset size">
          <button id="fullBtn" type="button" aria-pressed="true">466px</button>
          <button id="halfBtn" type="button" aria-pressed="false">233px</button>
        </div>
        <a href="assets/major/manifest.json">Manifest</a>
        <a href="assets/major/nano-banana-prompts.md">Nano Banana Prompts</a>
        <a href="assets/major/contact-sheet-full.jpg">Contact Sheet</a>
      </div>
      <section id="cards" class="grid" aria-label="Major Arcana"></section>
    </main>
    <script>
      const cards = [
        [0, "The Fool", "fool"],
        [1, "The Magician", "magician"],
        [2, "The High Priestess", "priestess"],
        [3, "The Empress", "empress"],
        [4, "The Emperor", "emperor"],
        [5, "The Hierophant", "hierophant"],
        [6, "The Lovers", "lovers"],
        [7, "The Chariot", "chariot"],
        [8, "Strength", "strength"],
        [9, "The Hermit", "hermit"],
        [10, "Wheel of Fortune", "fortune"],
        [11, "Justice", "justice"],
        [12, "The Hanged Man", "hanged"],
        [13, "Death", "death"],
        [14, "Temperance", "temperance"],
        [15, "The Devil", "devil"],
        [16, "The Tower", "tower"],
        [17, "The Star", "star"],
        [18, "The Moon", "moon"],
        [19, "The Sun", "sun"],
        [20, "Judgement", "judgement"],
        [21, "The World", "world"],
      ];

      const grid = document.querySelector("#cards");
      const fullBtn = document.querySelector("#fullBtn");
      const halfBtn = document.querySelector("#halfBtn");

      function render(size) {
        const dir = size === "half" ? "half" : "full";
        grid.innerHTML = cards
          .map(([number, title, slug]) => {
            const file = `${String(number).padStart(2, "0")}-${slug}.png`;
            const src = `assets/major/${dir}/${file}`;
            return `
              <figure>
                <div class="disc"><img src="${src}" alt="${title}" loading="lazy" /></div>
                <figcaption><span>${String(number).padStart(2, "0")} ${title}</span><a href="${src}">PNG</a></figcaption>
              </figure>
            `;
          })
          .join("");
        fullBtn.setAttribute("aria-pressed", String(size !== "half"));
        halfBtn.setAttribute("aria-pressed", String(size === "half"));
      }

      fullBtn.addEventListener("click", () => render("full"));
      halfBtn.addEventListener("click", () => render("half"));
      render("full");
    </script>
  </body>
</html>
